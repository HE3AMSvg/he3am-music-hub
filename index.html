<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HE3AM Music Hub</title><link rel="stylesheet" href="style.css"></head><body><header><b>🎧 HE3AM Music Hub</b><button id="theme">☀️</button></header><main><section class="hero"><div><small>PLAYLIST MANAGER</small><h1>Your music.<br><span>Your way.</span></h1><p>Organize your music locally — no Spotify, no account, no server.</p></div><button id="new" class="primary">＋ New playlist</button></section><section class="stats"><div><strong id="pc">0</strong><small>Playlists</small></div><div><strong id="tc">0</strong><small>Tracks</small></div><div><strong id="fc">0</strong><small>Favorites</small></div></section><section class="toolbar"><input id="search" placeholder="Search playlists or tracks…"><button id="import">Import</button><button id="backup">Backup</button><input id="file" type="file" accept=".txt,.csv,.json" hidden></section><section id="list" class="grid"></section></main><div id="modal" class="modal hidden"><div class="dialog"><button id="close">×</button><h2>New playlist</h2><input id="name" placeholder="Playlist name"><input id="desc" placeholder="Description"><button id="save" class="primary wide">Create</button></div></div><script src="app.js"></script></body></html>
